kind: app
version: 0.3.0
dependencies: []
app:
  name: 失物招领事务所
  mode: advanced-chat
  icon: ☂️
  icon_background: '#E0F2FE'
  description: 会记住你承诺的雨夜调查游戏
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables:
  - id: 1d50359d-05cc-42fb-a596-324d232b898d
    name: GAME_API_URL
    value: http://lost-found-memory:8787
    value_type: string
    description: 存档服务地址
  - id: e19c0c8b-17ce-4a61-8059-f35b83a93077
    name: GAME_API_TOKEN
    value: ''
    value_type: secret
    description: 与存档服务一致的令牌
  features:
    opening_statement: 雨夜的失物招领事务所还亮着灯。发「A7K9 查看」开始。下次开新对话时，用同一个存档码继续。
    suggested_questions:
    - A7K9 查看
    - A7K9 承诺
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    file_upload:
      enabled: false
      image:
        enabled: false
  graph:
    nodes:
    - id: '100'
      type: custom
      data:
        desc: ''
        selected: false
        type: start
        title: 玩家输入
        variables: []
      position: &id001
        x: 70
        y: 200
      positionAbsolute: *id001
      height: 58
      width: 244
      sourcePosition: right
      targetPosition: left
